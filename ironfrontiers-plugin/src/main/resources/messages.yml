# Все сообщения игрокам и администраторам находятся здесь.
# Формат: MiniMessage; старые цветовые коды &a, &c и т.п. также поддерживаются.
# Плейсхолдеры задаются в фигурных скобках: {sector}, {seconds}, {param}.
general:
  prefix: "<dark_gray>[<gold>IronFrontiers</gold>]</dark_gray> "
  no_permission: "<red>У вас недостаточно прав."
  player_only: "<red>Эту команду может выполнить только игрок."
  unknown_subcommand: "<red>Неизвестная подкоманда. Используйте <yellow>/if</yellow>."
  reload_done: "<green>Конфигурации перезагружены."
  reload_restart_required: "<yellow>Параметр <white>{param}</white> изменён, но требует перезапуска сервера."
  db_unavailable: "<red>База данных недоступна. Игровые механики временно отключены."
  multiserver_forbidden: "<red>Эта операция запрещена в многосерверном режиме."
  usage:
    root: "<yellow>Использование: /if reload"
    reload: "<yellow>Использование: /if reload"
    sectors: "<yellow>Использование: /if sectors create|list|info|tp|show|delete|set|rescan"
    mobs: "<yellow>Использование: /if mobs"
    stronghold: "<yellow>Использование: /if stronghold build|repair|delete"
    menu: "<yellow>Использование: /if menu open|close"
    blueprint: "<yellow>Использование: /if blueprint export|export_broken"
sector:
  not_found: "<red>Сектор {sector} не найден."
  name_invalid: "<red>Имя сектора может содержать только латинские буквы, цифры, _ и -."
  name_exists: "<red>Сектор с таким именем уже существует."
  list_header: "<gold>Список секторов:"
  line: "<gray>• <white>{sector}</white> — {state} <dark_gray>(KPM: {kpm})"
  info:
    header: "<gold>Информация о секторе {sector}"
    world: "<gray>Мир: <white>{world}"
    state: "<gray>Состояние: <white>{state}"
    kpm: "<gray>KPM: <white>{kpm}"
    capture: "<gray>Порог захвата: <white>{kpm_capture}"
    held: "<gray>Порог удержания: <white>{kpm_held}"
    time: "<gray>Осталось времени: <white>{time}"
    area: "<gray>Площадь: <white>{area}"
    stronghold: "<gray>Форпост: <white>{stronghold}"
  tp_done: "<green>Вы перемещены к сектору {sector}."
  delete_prompt: "<yellow>Удалить сектор {sector} через {seconds} сек.? Выполните /if agree."
  delete_done: "<green>Сектор {sector} удалён."
  set_done: "<green>Для сектора {sector} параметр {what} установлен в {value}."
  set_invalid: "<red>Недопустимое значение параметра."
  show_started: "<green>Предпросмотр сектора включён на {seconds} сек."
  rescan_started: "<yellow>Пересканирование сектора запущено."
  rescan_done: "<green>Пересканирование сектора завершено."
  rescan_forbidden: "<red>Пересканирование запрещено в многосерверном режиме."
selection:
  tool_name: "<gold>Инструмент выделения сектора"
  tool_given: "<green>Инструмент выделения выдан."
  session_lost: "<red>Сессия выделения потеряна."
  no_session: "<red>У вас нет активной сессии выделения."
  point_added: "<green>Вершина {n}: X={x}, Z={z}."
  point_removed: "<yellow>Последняя вершина удалена."
  err_world: "<red>Нельзя выделять сектор в другом мире."
  err_axis: "<red>Следующая вершина должна лежать на X={px} или Z={pz}."
  err_close_axis: "<red>Последняя точка должна иметь X={x0} или Z={z0}."
  err_overlap_edge: "<red>Новое ребро пересекает или касается несмежного ребра."
  err_reverse: "<red>Ребро разворачивается на 180 градусов."
  err_intersects_sector: "<red>Территория пересекается с сектором {sector}."
  err_border: "<red>Точка находится за пределами WorldBorder."
  created: "<green>Сектор {sector} создан. Площадь: {area} клеток."
confirm:
  none_pending: "<red>Нет ожидающей команды для подтверждения."
  expired: "<red>Время подтверждения истекло."
  accepted: "<green>Команда подтверждена."
game:
  captured: "<green>Сектор {sector} захвачен!"
  destruction_started_single: "<red>Контроль над сектором {sector} под угрозой. Осталось {time}."
  destruction_started_multi: "<red>Контроль над секторами {sectors} под угрозой. Осталось {time}."
  destruction_cancelled: "<green>Контроль над сектором {sector} восстановлен."
  lost_single: "<red>Сектор {sector} потерян."
  lost_multi: "<red>Потеряны сектора {sectors}."
  startup_grace: "<yellow>Активен период безопасного запуска."
stronghold:
  not_available: "<red>В этом секторе нет форпоста."
  blocked_state: "<red>Действие недоступно в текущем состоянии сектора."
  build_started: "<green>Строительство форпоста началось."
  build_done: "<green>Форпост построен."
  repair_started: "<green>Ремонт форпоста начался."
  repair_done: "<green>Форпост отремонтирован."
  broken: "<red>Форпост разрушен."
  deleted: "<yellow>Форпост удалён."
  admin_build: "<green>Принудительное строительство запущено."
  admin_repair: "<green>Принудительный ремонт запущен."
  admin_delete: "<yellow>Форпост удалён администратором."
menu:
  open_error_state: "<red>Меню недоступно в текущем состоянии сектора."
  open_error_nostronghold: "<red>Для этого сектора не настроен форпост."
  donate_blocked: "<red>Сейчас пожертвования недоступны."
  donate_done: "<green>Принято предметов: {amount}."
  donate_returned: "<yellow>Излишек возвращён в инвентарь."
  closed: "<gray>Меню закрыто."
blueprint:
  export_done: "<green>Чертёж {name} экспортирован: {count} блоков, пропущено {skipped}."
  err_selection: "<red>Сначала выделите область WorldEdit."
  err_target: "<red>Некорректная цель экспорта."
  err_too_big: "<red>Чертёж превышает допустимое число блоков."
  err_worldedit: "<red>WorldEdit/FAWE не найден."
config:
  warn:
    invalid_type: "Неверный тип значения"
    invalid_range: "Значение вне допустимого диапазона"
    invalid_id: "Неверный идентификатор"
    disabled_entry: "Элемент отключён из-за ошибок конфигурации"
