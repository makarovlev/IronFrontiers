# ПОДДЕРЖИВАЕМЫЕ ПЛЕЙСХОЛДЕРЫ МЕНЮ:
# {sector_id} {sector_name} {sector_state} {stronghold_state} {phase}
# {requirements} {total_percent} {player_donated} {sector_donated} {time_left}
# {perk_safe} {perk_destruction} {perk_held} {player_name}
# Допускаются PlaceholderAPI placeholders и MiniMessage / legacy &-коды.
# size: 9 или 27; interactive_slots — единственные слоты для перемещения предметов.
bar:
  char: "⏽"
  segments: 20
  filled_color: '&a'
  empty_color: '&8'
fill_material: BLACK_STAINED_GLASS_PANE
info_menu:
  title: "&8Форпост: {sector_name}"
  size: 27
  update_interval_ticks: 10
  interactive_slots: []
  slots: {}
donate_menu:
  title: "&8Пожертвования: {sector_name}"
  size: 27
  update_interval_ticks: 10
  interactive_slots: [10, 11, 12, 13, 14, 15, 16]
  slots: {}
