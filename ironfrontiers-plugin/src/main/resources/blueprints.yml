# ЧЕРТЕЖИ ФОРПОСТОВ
# Внутренняя координата "0,0,0" — блок, размещаемый в stronghold.center сектора.
# +X — вправо по X, +Y — вверх, +Z — вперёд; отрицательные координаты допустимы.
# Значение — ванильный Bukkit BlockData: oak_log[axis=y], stone_bricks и т.п.
# Допускаются блоки с коллизией без block entity. AIR — только в broken_strongholds.
# link связывает обычный чертёж со схемой разрушения.
# Конвертер WorldEdit: /if blueprint export (будет добавлен на этапе 3).
blueprints:
  bp_example:
    link: broken_example
    blocks:
      "0,0,0": "stone_bricks"
      "1,0,0": "stone_bricks"
      "0,1,0": "oak_planks"
broken_strongholds:
  broken_example:
    "0,1,0": "air"
